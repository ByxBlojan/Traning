function pl(){const q=PK.q.toLowerCase(),L=ALL().map((e,k)=>[e,k]).filter(([e])=>q?e.n.toLowerCase().includes(q):e.g==PK.g).sort((a,b)=>S.favs.includes(b[0].n)-S.favs.includes(a[0].n));
return L.map(([e,k])=>`<div class="card ex" onclick="pk(${k})">${fig(e.n)}<div style="flex:1"><b>${esc(e.n)}</b><div class="m">${esc(e.eq)} · ${esc(e.r)}</div></div><button onclick="event.stopPropagation();fav(${k})">${S.favs.includes(e.n)?'★':'☆'}</button></div>`).join('')||'<p class="m">Inga träffar</p>'}
function pk(k){const n=ALL()[k].n,cb=PK.cb;PK=null;cb(n);sv();render()}
function fav(k){const n=ALL()[k].n,i=S.favs.indexOf(n);i<0?S.favs.push(n):S.favs.splice(i,1);sv();$('#pl').innerHTML=pl()}
function own(){const n=prompt('Namn på övningen?');if(!n)return;S.custom.push({n,g:PK.g,eq:'Annat',r:'3×8–12',i:'Egen övning.'});sv();$('#pl').innerHTML=pl()}
const tog=(a,v)=>{const i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);render()};
const chips=(L,a,f)=>`<div class="chips">${L.map(x=>`<button class="ch ${a.includes(x)?'on':''}" onclick="${f}('${x}')">${x}</button>`).join('')}</div>`;
const PV={Bröst:[['Bänkpress','Hantelpress','Kabelflyes'],['Bröstpress maskin','Kabelflyes','Armhävningar'],['Hantelpress','Kabelflyes','Armhävningar']],
Rygg:[['Latsdrag','Sittande kabelrodd','Hantelrodd'],['Hakdrag','Sittande kabelrodd','Hantelrodd'],['Marklyft','Latsdrag','Sittande kabelrodd']],
Axlar:[['Axelpress med hantlar','Sidolyft','Face pull'],['Axelpress maskin','Sidolyft','Face pull'],['Sidolyft','Face pull','Axelpress med hantlar']],
Biceps:[['Skivstångscurl','Hammercurl'],['Bicepscurl med hantlar','Kabelcurl'],['Hammercurl','Kabelcurl','Skivstångscurl']],
Triceps:[['Skull crushers','Triceps pushdown med rep','Overhead triceps extension'],['Dips','Triceps pushdown med rak stång','Overhead triceps extension'],['Triceps pushdown med rep','Overhead triceps extension','Triceps pushdown med rak stång']],
Ben:[['Knäböj','Raka marklyft','Benspark'],['Benpress','Utfall','Benspark'],['Utfall','Raka marklyft','Benpress']],
Mage:[['Hängande benlyft','Planka'],['Kabelcrunch','Planka'],['Planka','Kabelcrunch','Hängande benlyft']]};
function passes(gs){const g=G.filter(x=>gs.includes(x)&&PV[x]),out=[],seen=new Set();
[0,1,2].forEach(v=>{const L=[],notes=[];
g.forEach(x=>{let a=PV[x][v].slice();
if(x=='Triceps'&&(g.includes('Bröst')||g.includes('Axlar'))){a=a.slice(0,2);notes.push('Triceps: 2 övningar, eftersom press för bröst och axlar redan tränar triceps.')}
if(x=='Biceps'&&g.includes('Rygg')){a=a.slice(0,2);notes.push('Biceps: 2 övningar, eftersom drag och rodd redan tränar biceps.')}
if(x=='Axlar'&&g.includes('Bröst')){a=a.filter(n=>!n.startsWith('Axelpress'));notes.push('Axlar: ingen tung press, eftersom bröstpress redan tränar framsidan av axeln.')}
if(x=='Rygg'&&g.includes('Ben')){a=a.filter(n=>n!='Marklyft');notes.push('Rygg: inget marklyft, eftersom benpassets marklyft och böj redan belastar ländrygg och baksida lår.')}
a.forEach(n=>{if(!L.includes(n))L.push(n)})});
const k=L.join('|');if(L.length&&!seen.has(k)){seen.add(k);out.push({n:'Pass '+'ABC'[v],ex:L,notes:[...new Set(notes)]})}});return out}
function vPassVal(){return`<button class="s" style="width:auto;padding:0 14px" onclick="ST=2;render()">← Tillbaka</button><h1>Välj pass</h1><p class="m">${SEL.join(' + ')}. Passen börjar med stora övningar, håller sig runt vanliga riktmärken (ungefär 10–20 set per muskelgrupp och vecka om du tränar gruppen 1–2 gånger) och undviker onödiga dubbletter när grupper överlappar. Det är generella rekommendationer, inte medicinsk rådgivning.</p>${PS.length?PS.map((p,i)=>{const tot=p.ex.reduce((a,n)=>a+(parseInt(info(n).r)||3),0);return`<div class="card"><div class="row"><b>${p.n}</b><span class="m">${tot} set · ca ${Math.round(tot*2.5)} min</span></div>${p.ex.map(n=>`<div class="ex" style="margin-top:10px">${fig(n)}<div><b>${esc(n)}</b><div class="m">${esc(info(n).r)} · ${esc(info(n).eq)}<br>${tr(n)}</div></div></div>`).join('')}${p.notes.map(t=>`<p class="m">• ${esc(t)}</p>`).join('')}<br><button class="p" onclick="start(SEL.slice(),PS[${i}].ex)">Starta pass</button></div>`}).join(''):'<p class="m">Inga färdiga pass för de valda grupperna. Använd Lägg till övning.</p>'}`}
const cnt=t=>S.sessions.filter(x=>x.start>=t).length;
function vHome(){const d=new Date(),w=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7)),l=S.sessions[S.sessions.length-1];
return`<h2 style="margin-top:0">Antal pass</h2><div class="row" style="gap:8px;align-items:stretch">${[['Denna vecka',cnt(+w)],['Denna månad',cnt(+new Date(d.getFullYear(),d.getMonth(),1))],['I år',cnt(+new Date(d.getFullYear(),0,1))]].map(x=>`<div class="card" style="flex:1;text-align:center;margin:0"><div style="font-size:30px;font-weight:600;line-height:1.2">${x[1]}</div><div class="m">${x[0]}</div></div>`).join('')}</div><br><button class="p" style="min-height:52px;font-size:16px" onclick="SEL=[];ST=1;render()">Träna nu</button>
${l?`<div class="card m">Senaste passet: <b style="color:var(--t)">${l.groups.join(' + ')||'Pass'}</b>, ${dt(l.start)}</div>`:''}
${S.favs.length?`<h2>Favoritövningar</h2><div class="chips">${S.favs.map(n=>`<button class="ch" onclick="start([info('${n}').g],['${n}'])">${esc(n)}</button>`).join('')}</div>`:''}`}
function vTr(){const a=S.active;
if(SUM){const s=SUM.s;return`<h1>Bra jobbat!</h1><div class="card"><div class="row"><span>${dt(s.start)}</span><span>${Math.max(1,Math.round((s.end-s.start)/6e4))} min</span></div><p>${s.groups.join(' + ')||'Pass'}<br>${s.ex.length} övningar · ${SUM.sets} set · ${Math.round(SUM.vol)} kg volym${s.cardio.length?'<br>Kardio: '+s.cardio.map(c=>c.t+' '+c.m+' min').join(', '):''}</p>${SUM.prs.map(p=>`<div class="pr">NYTT REKORD! ${esc(p)}</div>`).join('')}</div><textarea id="nt" rows="3" placeholder="Anteckningar"></textarea><br><br><button class="p" onclick="done()">SPARA PASSET</button><button class="s" onclick="SUM=null;render()">Tillbaka</button>`}
if(!a){
if(ST==1)return`<button class="s" style="width:auto;padding:0 14px" onclick="ST=0;render()">← Tillbaka</button><h1>Vad ska du träna?</h1>${chips(G,SEL,'tg2')}<br><button class="p" ${SEL.length?'':'disabled style="opacity:.4"'} onclick="ST=2;render()">Fortsätt</button>`;
if(ST==2)return`<button class="s" style="width:auto;padding:0 14px" onclick="ST=1;render()">← Tillbaka</button><h1>${SEL.join(' + ')}</h1><button class="p" onclick="const g=SEL.slice();start(g,[]);pick(n=>addEx(n))">Lägg till övning</button><button class="s" onclick="PS=passes(SEL);ST=3;render()">Välj pass</button>`;
if(ST==3)return vPassVal();
return vHome()}
const mins=Math.round((Date.now()-a.start)/6e4);
return`<div class="row"><h1>${a.groups.join(' + ')||'Pass'}</h1><span class="m">${mins} min</span></div>
${a.ex.map((e,i)=>{const l=lastOf(e.n),o=info(e.n);return`<div class="card"><details><summary class="ex">${fig(e.n)}<div style="flex:1"><b>${esc(e.n)}</b><div class="m">${l?'Senast: '+l[0].w+' kg × '+l[0].r:'Ingen historik'}</div></div></summary>${big(e.n)}<p class="m">${cap(e.n)}<br>${esc(o.eq)} · ${esc(o.r)}<br>${esc(o.i)}</p></details>
${e.sets.map((s,j)=>`<div class="r"><span class="m">${j+1}</span><input type="number" inputmode="decimal" placeholder="kg" value="${s.w}" onchange="up(${i},${j},'w',this.value)"><input type="number" inputmode="numeric" placeholder="reps" value="${s.r}" onchange="up(${i},${j},'r',this.value)"><button class="ok ${s.d?'d':''}" onclick="tg(${i},${j})">✓</button><button onclick="delSet(${i},${j})" style="padding:0">✕</button></div>`).join('')}
<button class="s" onclick="addSet(${i})">+ LÄGG TILL SET</button></div>`}).join('')}
<button class="s" onclick="pick(n=>addEx(n))">+ Lägg till övning</button>
<details class="card"><summary><b>+ Kardio</b></summary><br><select id="ct">${CT.map(c=>`<option>${c}</option>`).join('')}</select><br><br><div class="row"><input id="cm" type="number" inputmode="decimal" placeholder="minuter"><input id="ck" type="number" inputmode="decimal" placeholder="km"><input id="cl" placeholder="lutning %"></div><br><button class="s" onclick="addCardio()">Spara kardio</button></details>
${a.cardio.map((c,i)=>`<div class="card row"><span>${c.t}: ${c.m} min${c.k?', '+c.k+' km':''}</span><button onclick="S.active.cardio.splice(${i},1);sv();render()">✕</button></div>`).join('')}
<button class="p" onclick="fin()">AVSLUTA PASS</button><button class="s" onclick="if(confirm('Kasta passet?')){S.active=null;sv();render()}">Avbryt pass</button>`}
const tg2=v=>tog(SEL,v),tgG=v=>tog(GS,v),tgE=v=>tog(EQ,v);
function vPass(){const g=GEN;
return`<h1>Träningspass</h1><div class="card"><h2 style="margin-top:0">Muskelgrupp</h2>${chips(G.slice(0,7),GS,'tgG')}<h2>Längd</h2><div class="chips">${[['k','Kort 15–20 min'],['n','Normalt 30–45 min'],['l','Långt 45–60 min']].map(x=>`<button class="ch ${LEN==x[0]?'on':''}" onclick="LEN='${x[0]}';render()">${x[1]}</button>`).join('')}</div><h2>Utrustning (valfritt)</h2>${chips(EQL,EQ,'tgE')}<br><button class="p" onclick="gen()">SKAPA PASS</button></div>
${g?`<h2>Ditt ${g.g.join(' + ').toLowerCase()}pass</h2>${g.ex.map((n,i)=>{const o=info(n);return`<div class="card ex">${fig(n)}<div style="flex:1"><b>${i+1}. ${esc(n)}</b><div class="m">${esc(o.r)} · ${esc(o.eq)}</div></div><button onclick="swap(${i})">Byt</button></div>`}).join('')}<button class="p" onclick="start(GEN.g,GEN.ex)">STARTA PASSET</button><button class="s" onclick="S.saved.push({name:GEN.g.join(' + ')+' pass',g:GEN.g,ex:GEN.ex.slice()});sv();render()">SPARA SOM FAVORIT</button>`:''}
${S.saved.length?`<h2>Sparade pass</h2>${S.saved.map((p,i)=>`<div class="card"><b>${esc(p.name)}</b><div class="m">${p.ex.map(esc).join(', ')}</div><br><div class="row"><button onclick="start(S.saved[${i}].g,S.saved[${i}].ex)" class="p" style="margin:0">Starta</button><button onclick="S.saved.splice(${i},1);sv();render()">Ta bort</button></div></div>`).join('')}`:''}`}
function vUtv(){const ns=[...new Set(S.sessions.flatMap(s=>s.ex.map(e=>e.n)))];if(!ns.length)return'<h1>Utveckling</h1><p class="m">Avsluta ditt första pass för att se statistik.</p>';
if(!ns.includes(CHN))CHN=ns[0];const pts=S.sessions.map(s=>{const e=s.ex.find(x=>x.n==CHN);return e&&{t:s.start,v:Math.max(...e.sets.map(t=>e1(t.w,t.r))),b:e.sets.reduce((a,t)=>e1(t.w,t.r)>e1(a.w,a.r)?t:a)}}).filter(Boolean);
const mx=Math.max(...pts.map(p=>p.v),1),mn=Math.min(...pts.map(p=>p.v)),X=i=>pts.length>1?10+i*300/(pts.length-1):160,Y=v=>120-(mx==mn?60:(v-mn)/(mx-mn)*100),b=pts.reduce((a,p)=>p.v>a.v?p:a);
const wk=S.sessions.filter(s=>s.start>Date.now()-6048e5).length,mo=S.sessions.filter(s=>s.start>Date.now()-2592e6).length,vol=S.sessions.reduce((a,s)=>a+s.ex.reduce((x,e)=>x+e.sets.reduce((y,t)=>y+(+t.w||0)*(+t.r||0),0),0),0);
return`<h1>Utveckling</h1><div class="card row"><div><b style="font-size:26px">${wk}</b><div class="m">pass i veckan</div></div><div><b style="font-size:26px">${mo}</b><div class="m">senaste 30 d</div></div><div><b style="font-size:26px">${Math.round(vol/1000)}</b><div class="m">ton totalt</div></div></div>
<select onchange="CHN=this.value;render()">${ns.map(n=>`<option ${n==CHN?'selected':''}>${esc(n)}</option>`).join('')}</select><br><br><div class="card"><div class="m">Uppskattad maxstyrka (1RM, kg)</div><svg viewBox="0 0 320 140" width="100%"><polyline fill="none" stroke="#fafafa" stroke-width="3" points="${pts.map((p,i)=>X(i)+','+Y(p.v)).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="4" fill="#fafafa"/>`).join('')}</svg><div class="m">Personligt rekord: <span class="pr">${b.b.w} kg × ${b.b.r}</span> (${Math.round(b.v)} kg uppsk. 1RM)</div></div>
${pts.slice(-6).reverse().map(p=>`<div class="row card"><span>${dt(p.t)}</span><b>${p.b.w} kg × ${p.b.r}</b></div>`).join('')}`}
let CHN='';
function vHis(){return`<h1>Historik</h1>${S.sessions.length?S.sessions.slice().reverse().map(s=>{const i=S.sessions.indexOf(s);return`<details class="card"><summary class="row"><b>${s.groups.join(' + ')||'Pass'}</b><span class="m">${dt(s.start)} · ${s.ex.length} övn.</span></summary><br>${s.ex.map(e=>`<p><b>${esc(e.n)}</b><br><span class="m">${e.sets.map(t=>t.w+'×'+t.r).join(' · ')}</span></p>`).join('')}${s.cardio.map(c=>`<p>${c.t}: ${c.m} min${c.k?', '+c.k+' km':''}</p>`).join('')}${s.note?`<p class="m">${esc(s.note)}</p>`:''}<button onclick="if(confirm('Ta bort passet?')){S.sessions.splice(${i},1);sv();render()}">Ta bort</button></details>`}).join(''):'<p class="m">Inga pass ännu.</p>'}
<h2>Säkerhetskopia (data finns endast på den här enheten)</h2><textarea id="bk" rows="3">${esc(TXT)}</textarea><br><br><div class="row"><button class="s" onclick="TXT=JSON.stringify(S);render();try{navigator.clipboard.writeText(TXT)}catch(e){}">Exportera</button><button class="s" onclick="try{S=Object.assign(ld(),JSON.parse($('#bk').value));sv();render()}catch(e){alert('Ogiltig data')}">Importera</button></div><br><div class="m" id="sy">${SYNC}</div>${U?`<div class="m">Inloggad som ${esc(U.email)}</div>`:''}`}
function render(){$('#hd').innerHTML=U?'<b>Träningsdagbok</b><button onclick="out()">Logga ut</button>':'';if(sb&&!U){$('#v').innerHTML=AV=='up'?vSignup():vLogin();$('#nv').innerHTML='';$('#pkw').innerHTML='';return}$('#v').innerHTML=[vTr,vPass,vUtv,vHis][T]();
$('#nv').innerHTML=[['🏋️','Träna'],['⚡','Träningspass'],['📈','Utveckling'],['🗓️','Historik']].map((x,i)=>`<button class="${T==i?'on':''}" onclick="T=${i};SUM=null;ST=0;render();scrollTo(0,0)">${x[1]}</button>`).join('');
$('#pkw').innerHTML=PK?`<div id="pk"><div class="row"><h1>Välj övning</h1><button onclick="PK=null;render()">Stäng</button></div><input placeholder="Sök övning" value="${esc(PK.q)}" oninput="PK.q=this.value;$('#pl').innerHTML=pl()"><br><br><div class="chips">${G.slice(0,7).map(g=>`<button class="ch ${PK.g==g?'on':''}" onclick="PK.g='${g}';PK.q='';render()">${g}</button>`).join('')}</div><br><div id="pl">${pl()}</div><button class="s" onclick="own()">+ Egen övning</button></div>`:''
}
(async()=>{if(sb){try{const r=await sb.auth.getSession();if(r.data.session)await enter(r.data.session.user)}catch(e){}}render()})();
</script></body></html>
